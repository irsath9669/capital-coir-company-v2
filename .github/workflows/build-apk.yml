name: Build Capital Coir V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP_CONTENT=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_CONTENT" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "Project directory:"
          pwd

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo "App source:"
          find "$PROJECT_DIR/app/src/main" -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapitalCoirCompany-V2-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
